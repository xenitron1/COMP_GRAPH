<svg xmlns="http://www.w3.org/2000/svg" width="360" height="280">
  <!-- Вершины треугольника:
       A = (60,215)
       B = (170,65)
       C = (300,225)
  -->

  <!-- Стороны треугольника -->
  <line x1="60" y1="215" x2="170" y2="65" stroke="black" />
  <line x1="170" y1="65" x2="300" y2="225" stroke="black" />
  <line x1="300" y1="225" x2="60" y2="215" stroke="black" />

  <!-- Биссектрисы. Конечные точки лежат на противоположных сторонах -->
  <line x1="60" y1="215" x2="227" y2="135" stroke="blue" />
  <line x1="170" y1="65" x2="174" y2="220" stroke="blue" />
  <line x1="300" y1="225" x2="119" y2="134" stroke="blue" />
</svg>
